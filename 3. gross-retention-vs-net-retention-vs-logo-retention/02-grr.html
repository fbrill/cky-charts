<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gross Revenue Retention (GRR) - Charts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --ck-font-family:
          "General Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, sans-serif;
        --ck-color-dark: #1f1a14;
        --ck-color-text: #29241e;
        --ck-color-text-muted: #8c7b6f;
        --ck-color-border: #f8efe6;
        --ck-color-bg: #fff;
        --ck-color-blue: #155eef;
        --ck-color-green: #239274;
        --ck-color-red: #f23655;
        --ck-color-orange: #dc6803;
        --ck-radius: 12px;
        --ck-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      body {
        background: #f5f5f5;
        padding: 20px;
        margin: 0;
      }

      .ck-chart {
        width: 100%;
        max-width: 800px;
        margin: 2.5em auto;
        font-family: var(--ck-font-family);
        box-shadow: var(--ck-shadow);
        border-radius: var(--ck-radius);
        overflow: hidden;
        background: var(--ck-color-bg);
      }

      .ck-chart-title {
        font-size: 22px;
        font-weight: 600;
        color: var(--ck-color-text);
        margin: 0;
        padding: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--ck-color-border);
      }

      .ck-chart-area {
        padding: 28px;
        position: relative;
      }

      /* Legend */
      .grr-legend {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 16px 28px 0;
        font-family: var(--ck-font-family);
        flex-wrap: wrap;
      }

      .grr-legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ck-color-text);
      }

      .grr-legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
      }

      /* Canvas */
      .chart-container {
        position: relative;
        width: 100%;
      }

      .chart-canvas {
        width: 100%;
        display: block;
      }

      /* Footer */
      .grr-formula {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
        padding: 14px 28px;
        border-top: 1px solid var(--ck-color-border);
        font-family: var(--ck-font-family);
        font-size: 13px;
        color: var(--ck-color-text-muted);
        line-height: 1.6;
      }

      .grr-formula code {
        background: #f4f0eb;
        padding: 2px 7px;
        border-radius: 4px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 12px;
        color: var(--ck-color-text);
      }

      @media (max-width: 768px) {
        .ck-chart {
          margin: 1.5em 0;
          border-radius: 8px;
          max-width: 100%;
        }
        .ck-chart-title {
          font-size: 20px;
        }
      }

      @media (max-width: 480px) {
        .ck-chart-title {
          font-size: 18px;
        }
        .grr-legend {
          gap: 12px;
        }
        .grr-legend-item {
          font-size: 11px;
        }
        .grr-formula {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>

    <div id="ghost-content">

    <div class="ck-chart" id="grr-chart-container">
      <div class="ck-chart-title">
        <svg width="42" height="42" viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg">

          <path d="M17.3751 20.3815C18.8389 20.3815 19.6633 19.6665 20.1597 18.7916L18.5361 17.8746C18.2921 18.3121 17.9808 18.6149 17.4256 18.6149C16.7778 18.6149 16.3236 18.0765 16.3236 17.311V17.2941C16.3236 16.5875 16.761 16.007 17.4256 16.007C17.964 16.007 18.2753 16.3015 18.494 16.7221L20.1176 15.7715C19.6213 14.8713 18.7464 14.2404 17.4508 14.2404C15.6926 14.2404 14.3214 15.5528 14.3214 17.311V17.3278C14.3214 19.1533 15.7431 20.3815 17.3751 20.3815Z" fill="#F7B200"/>
        </svg>
        <span>Gross Revenue Retention (GRR)</span>
      </div>

      <div class="grr-legend">
        <div class="grr-legend-item">
          <div class="grr-legend-swatch" style="background: #155EEF;"></div>
          Retained MRR
        </div>
        <div class="grr-legend-item">
          <div class="grr-legend-swatch" style="background: #E53935;"></div>
          Churn
        </div>
        <div class="grr-legend-item">
          <div class="grr-legend-swatch" style="background: #F79009;"></div>
          Contractions
        </div>
      </div>

      <div class="ck-chart-area">
        <div class="chart-container">
          <canvas id="grr-canvas" class="chart-canvas"></canvas>
        </div>
      </div>

      <div class="grr-formula">
        <code>GRR = (Starting MRR - Churn - Contractions) / Starting MRR</code>
      </div>
    </div>

    <script>
      (function () {
        const canvas = document.getElementById('grr-canvas');
        const ctx = canvas.getContext('2d');

        // Colors
        const BLUE = '#155EEF';
        const RED = '#E53935';
        const ORANGE = '#F79009';
        const TEXT = '#29241E';
        const TEXT_MUTED = '#8C7B6F';
        const GRID = '#E8E0D8';
        const CAVEAT = "'Caveat', cursive";

        // Monthly data showing GRR declining over 6 months
        // Starting MRR each month = retained from last month (no expansion in GRR)
        const months = [
          { label: 'Jan',  startMRR: 100, churn: 10, contractions: 5 },
          { label: 'Feb',  startMRR: 85,  churn: 9,  contractions: 4 },
          { label: 'Mar',  startMRR: 72,  churn: 8,  contractions: 4 },
          { label: 'Apr',  startMRR: 60,  churn: 7,  contractions: 3 },
          { label: 'May',  startMRR: 50,  churn: 6,  contractions: 3 },
          { label: 'Jun',  startMRR: 41,  churn: 5,  contractions: 2 },
        ];

        // Compute retained and GRR for each month
        const data = months.map(m => {
          const retained = m.startMRR - m.churn - m.contractions;
          const grr = ((retained / m.startMRR) * 100).toFixed(0);
          return { ...m, retained, grr };
        });

        const maxVal = 110;
        const yTicks = [0, 20, 40, 60, 80, 100];

        function draw() {
          const dpr = window.devicePixelRatio || 1;
          const container = canvas.parentElement;
          const W = container.clientWidth;
          const isMobile = W < 480;
          const H = isMobile ? 340 : 420;

          canvas.width = W * dpr;
          canvas.height = H * dpr;
          canvas.style.width = W + 'px';
          canvas.style.height = H + 'px';
          ctx.scale(dpr, dpr);

          // Layout
          const padLeft = isMobile ? 42 : 55;
          const padRight = 20;
          const padTop = 25;
          const padBottom = isMobile ? 40 : 45;
          const chartW = W - padLeft - padRight;
          const chartH = H - padTop - padBottom;

          const barCount = data.length;
          const groupW = chartW / barCount;
          const barW = Math.min(groupW * 0.6, isMobile ? 44 : 70);

          function yPos(val) {
            return padTop + chartH - (val / maxVal) * chartH;
          }
          function barX(i) {
            return padLeft + groupW * i + (groupW - barW) / 2;
          }
          function barCenterX(i) {
            return barX(i) + barW / 2;
          }

          // Clear
          ctx.clearRect(0, 0, W, H);

          // Grid lines
          ctx.strokeStyle = GRID;
          ctx.lineWidth = 1;
          yTicks.forEach(tick => {
            const y = Math.round(yPos(tick)) + 0.5;
            ctx.beginPath();
            ctx.moveTo(padLeft, y);
            ctx.lineTo(W - padRight, y);
            ctx.stroke();
          });

          // Y-axis labels
          ctx.fillStyle = TEXT_MUTED;
          ctx.font = `500 ${isMobile ? 12 : 14}px "General Sans", -apple-system, sans-serif`;
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          yTicks.forEach(tick => {
            ctx.fillText('$' + tick + 'K', padLeft - 10, yPos(tick));
          });

          // X-axis line
          ctx.strokeStyle = '#C0B8B0';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(padLeft, yPos(0));
          ctx.lineTo(W - padRight, yPos(0));
          ctx.stroke();

          const radius = isMobile ? 3 : 5;

          // Draw stacked bars for each month
          data.forEach((m, i) => {
            const x = barX(i);
            const totalTop = yPos(m.startMRR);
            const totalBottom = yPos(0);

            // Retained portion (bottom, blue)
            const retainedTop = yPos(m.retained);
            const retainedBottom = totalBottom;
            ctx.fillStyle = BLUE;
            ctx.beginPath();
            ctx.moveTo(x, retainedBottom);
            ctx.lineTo(x + barW, retainedBottom);
            ctx.lineTo(x + barW, retainedTop);
            ctx.lineTo(x, retainedTop);
            ctx.closePath();
            ctx.fill();

            // Contractions portion (middle, orange)
            const contrTop = yPos(m.retained + m.contractions);
            const contrBottom = retainedTop;
            ctx.fillStyle = ORANGE;
            ctx.beginPath();
            ctx.moveTo(x, contrBottom);
            ctx.lineTo(x + barW, contrBottom);
            ctx.lineTo(x + barW, contrTop);
            ctx.lineTo(x, contrTop);
            ctx.closePath();
            ctx.fill();

            // Churn portion (top, red) with rounded top corners
            const churnTop = totalTop;
            const churnBottom = contrTop;
            ctx.fillStyle = RED;
            ctx.beginPath();
            ctx.moveTo(x + radius, churnTop);
            ctx.lineTo(x + barW - radius, churnTop);
            ctx.arcTo(x + barW, churnTop, x + barW, churnTop + radius, radius);
            ctx.lineTo(x + barW, churnBottom);
            ctx.lineTo(x, churnBottom);
            ctx.lineTo(x, churnTop + radius);
            ctx.arcTo(x, churnTop, x + radius, churnTop, radius);
            ctx.closePath();
            ctx.fill();

          });

          // Declining trendline across the GRR values
          ctx.strokeStyle = RED;
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.beginPath();
          data.forEach((m, i) => {
            // Place the trendline dot at the retained level
            const y = yPos(m.retained);
            const cx = barCenterX(i);
            if (i === 0) ctx.moveTo(cx, y);
            else ctx.lineTo(cx, y);
          });
          ctx.stroke();
          ctx.setLineDash([]);

          // Trendline dots
          data.forEach((m, i) => {
            const y = yPos(m.retained);
            const cx = barCenterX(i);
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx, y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = RED;
            ctx.lineWidth = 2;
            ctx.stroke();
          });

          // X-axis labels (month names)
          ctx.fillStyle = TEXT_MUTED;
          ctx.font = `500 ${isMobile ? 13 : 15}px "General Sans", -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          data.forEach((m, i) => {
            ctx.fillText(m.label, barCenterX(i), yPos(0) + 10);
          });

        }

        draw();
        window.addEventListener('resize', draw);
      })();
    </script>
    </div>
  </body>
</html>
